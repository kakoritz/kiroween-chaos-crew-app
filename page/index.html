<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Haunt Arena</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body, iframe { margin: 0; width: 100%; height: 100%; border: 0; background: #0b0713; color: #e8e0f5; font-family: system-ui, sans-serif; }
  #note { padding: 24px; }
</style>
</head>
<body>
<div id="note">
  <h1>Haunt Arena</h1>
  <p>Start the arena UI locally (<code>npm run ui:dev</code>), then it loads below from 127.0.0.1.</p>
</div>
<script>
  // Local only: the arena UI dev server binds 127.0.0.1.
  var url = new URLSearchParams(location.search).get('arena') || 'http://127.0.0.1:5173/';
  if (/^http:\/\/127\.0\.0\.1:\d+\//.test(url)) {
    var f = document.createElement('iframe');
    f.src = url; f.title = 'Haunt arena';
    document.body.appendChild(f);
    document.getElementById('note').style.display = 'none';
  }
</script>
</body>
</html>
